name: Release

# Pushing a version tag (vYYYY.MM.DD, e.g. v2026.11.11) builds the
# engine jar and publishes a GitHub Release with the jar and a CLI
# bundle attached. The fast gates run first, so a tag whose tree does
# not typecheck or pass tests never becomes a release.
#
# Supply chain: every action is pinned to a full commit SHA (the
# version comment is informational; Dependabot keeps both current),
# the release is created with the runner's bundled `gh` CLI rather
# than a third-party action, and both artifacts carry a SHA-256
# checksum file plus a signed build-provenance attestation that
# `gh attestation verify` can check against this workflow.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the release
  attestations: write # publish build provenance attestations
  id-token: write # OIDC token for signing the attestations

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check (format + lint + types)
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: Fetch engine libraries (SHA-512 verified)
        run: sh engine/fetch-libs.sh

      - name: Build skript-ts.jar
        run: sh engine/build.sh
        env:
          # build.sh defaults to the maintainer's local JDK path;
          # point it at the CI JDK instead.
          SKRIPT_TS_JDK: ${{ env.JAVA_HOME }}

      - name: Package the CLI bundle
        run: |
          mkdir -p dist/skript-ts-cli
          cp -r bin src dist/skript-ts-cli/
          cp package.json pnpm-workspace.yaml pnpm-lock.yaml README.md README.ja.md LICENSE dist/skript-ts-cli/
          cd dist && zip -r "skript-ts-cli-${GITHUB_REF_NAME}.zip" skript-ts-cli

      - name: Stage release artifacts and generate SHA-256 checksums
        run: |
          cp engine/build/skript-ts.jar dist/
          cd dist
          sha256sum skript-ts.jar "skript-ts-cli-${GITHUB_REF_NAME}.zip" > "sha256sums-${GITHUB_REF_NAME}.txt"
          cat "sha256sums-${GITHUB_REF_NAME}.txt"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/skript-ts.jar
            dist/skript-ts-cli-${{ github.ref_name }}.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --prerelease \
            "dist/skript-ts.jar" \
            "dist/skript-ts-cli-${GITHUB_REF_NAME}.zip" \
            "dist/sha256sums-${GITHUB_REF_NAME}.txt"
