name: Release

# Pushing a version tag (vYYYY.MM.DD, e.g. v2026.11.11) builds the
# engine jar and publishes a GitHub Release with the jar and a CLI
# bundle attached. The fast gates and the dependency audit run
# first, so a tag whose tree does not typecheck, pass tests, or
# audit clean at high severity never becomes a release.
#
# Supply chain:
# - Every action is pinned to a full commit SHA (the version
#   comment is informational; Dependabot keeps both current).
# - The work is split in two. The build job runs all repository and
#   dependency code (install, tests, javac) but holds only a
#   read-only token with credentials not persisted. The publish job
#   holds the write permissions and runs no repository code at all:
#   it downloads the built artifacts, attests them, and creates the
#   release with the runner's bundled `gh` CLI.
# - Both artifacts and their SHA-256 checksum file carry signed
#   build-provenance attestations; see SECURITY.md for the
#   `gh attestation verify` commands.

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # Only tags that follow the project's versioning, match
      # package.json, and point at a commit on main may release.
      - name: Validate the release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'; then
            echo "tag '$tag' does not match the vYYYY.MM.DD versioning format" >&2
            exit 1
          fi
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "${tag#v}" != "$pkg_version" ]; then
            echo "tag '$tag' does not match package.json version '$pkg_version'" >&2
            exit 1
          fi
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${tag}" --jq '.status')"
          case "$status" in
            behind|identical) ;;
            *)
              echo "tag '$tag' does not point at a commit on main (compare status: $status)" >&2
              exit 1
              ;;
          esac

      # Blocking audit of the lockfile before anything is installed
      # or executed (see audit.yml for the standing gate).
      - name: Dependency audit (high and above fail)
        run: pnpm audit --audit-level high

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check (format + lint + types)
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: Fetch engine libraries (SHA-512 verified)
        run: sh engine/fetch-libs.sh

      - name: Build skript-ts.jar
        run: sh engine/build.sh
        env:
          # build.sh defaults to the maintainer's local JDK path;
          # point it at the CI JDK instead.
          SKRIPT_TS_JDK: ${{ env.JAVA_HOME }}

      - name: Package the CLI bundle
        run: |
          mkdir -p dist/skript-ts-cli
          cp -r bin src dist/skript-ts-cli/
          cp package.json pnpm-workspace.yaml pnpm-lock.yaml README.md README.ja.md LICENSE dist/skript-ts-cli/
          cd dist && zip -r "skript-ts-cli-${GITHUB_REF_NAME}.zip" skript-ts-cli

      - name: Stage release artifacts and generate SHA-256 checksums
        run: |
          cp engine/build/skript-ts.jar dist/
          cd dist
          sha256sum skript-ts.jar "skript-ts-cli-${GITHUB_REF_NAME}.zip" > "sha256sums-${GITHUB_REF_NAME}.txt"
          cat "sha256sums-${GITHUB_REF_NAME}.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dist
          path: |
            dist/skript-ts.jar
            dist/skript-ts-cli-${{ github.ref_name }}.zip
            dist/sha256sums-${{ github.ref_name }}.txt
          if-no-files-found: error

  publish:
    name: Attest and publish release
    needs: build
    runs-on: ubuntu-latest
    # Protect this environment in the repository settings (required
    # reviewers) to gate releases on a human approval.
    environment: release
    permissions:
      contents: write # create the release
      attestations: write # publish build provenance attestations
      id-token: write # OIDC token for signing the attestations
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dist
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/skript-ts.jar
            dist/skript-ts-cli-${{ github.ref_name }}.zip
            dist/sha256sums-${{ github.ref_name }}.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --prerelease \
            "dist/skript-ts.jar" \
            "dist/skript-ts-cli-${GITHUB_REF_NAME}.zip" \
            "dist/sha256sums-${GITHUB_REF_NAME}.txt"
