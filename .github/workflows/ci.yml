name: CI

# The server-backed behavior verification (`bin/skript-ts.mjs verify`,
# which boots a real Paper server and drives mineflayer bots) is
# intentionally NOT part of CI v1: it is heavy and needs the sandbox
# server setup, so it stays on the Freestyle verification farm.
# CI covers the fast gates and the engine jar build.
#
# Supply chain: every action is pinned to a full commit SHA (the
# version comment is informational; Dependabot keeps both current).

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fast-gates:
    name: Fast gates (check + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Vite+ (`vp check`) runs the Oxfmt format check, Oxlint, and
      # the tsgolint type check in one pass.
      - name: Check (format + lint + types)
        run: pnpm check

      - name: Unit tests
        run: pnpm test

  dependency-audit:
    name: Dependency audit (pnpm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Hard gate: high and critical advisories fail the job. This
      # package has no production dependencies, so the audit covers
      # the dev toolchain that CI and contributors actually execute.
      - name: Audit (high and above fail)
        run: pnpm audit --audit-level high

      # Full report for lower severities, without failing the job:
      # moderate/low findings stay visible in the log instead of
      # blocking every pull request.
      - name: Audit (full report, informational)
        if: always()
        run: pnpm audit || true

  engine-jar:
    name: Engine jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: Fetch engine libraries (SHA-512 verified)
        run: sh engine/fetch-libs.sh

      - name: Build skript-ts.jar
        run: sh engine/build.sh
        env:
          # build.sh defaults to the maintainer's local JDK path;
          # point it at the CI JDK instead.
          SKRIPT_TS_JDK: ${{ env.JAVA_HOME }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skript-ts-jar
          path: engine/build/skript-ts.jar
          if-no-files-found: error
