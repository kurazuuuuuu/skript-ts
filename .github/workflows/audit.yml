name: Dependency audit

# `pnpm audit` is a time-varying external signal: a newly published
# advisory can turn a previously green tree red without any code
# change. It therefore gates the moments where dependency risk is
# actually accepted — dependency-file changes, a daily check on
# master, and (as a step in release.yml) every release — instead of
# blocking unrelated pull requests.
#
# The audit reads the lockfile only; nothing is installed, so the
# job never executes the toolchain it is auditing. This package has
# no production dependencies, so the audit covers the dev toolchain
# that CI and contributors actually run.

on:
  schedule:
    - cron: "23 4 * * *"
  push:
    branches:
      - master
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # Hard gate: high and critical advisories fail the job.
      # Registry errors also fail (fail-closed); the daily schedule
      # is the retry.
      - name: Audit (high and above fail)
        run: pnpm audit --audit-level high

      # Full report for lower severities, without failing the job:
      # moderate/low findings stay visible in the log.
      - name: Audit (full report, informational)
        if: always()
        run: pnpm audit || true
